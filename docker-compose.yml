version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: csr-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: csr_platform
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d csr_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: csr-platform-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@csr.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:

